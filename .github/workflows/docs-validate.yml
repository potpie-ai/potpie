name: Validate documentation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    # Never expose Spoke secrets to forked PRs; this job uses none.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run PR metadata unit tests
        run: node --test scripts/validate-pr.test.mjs

      - name: Validate PR title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/validate-pr-cli.mjs

      - name: Detect changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          docs=false
          user_facing=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*) docs=true ;;
            esac
            case "$f" in
              potpie/*) user_facing=true ;;
            esac
          done < <(printf '%s\n' "${files[@]}")
          echo "docs_changed=$docs" >> "$GITHUB_OUTPUT"
          echo "user_facing_changed=$user_facing" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          printf '  - %s\n' "${files[@]}"

      - name: Validate docs tree when documentation changed
        if: steps.changes.outputs.docs_changed == 'true'
        run: node scripts/validate-docs-cli.mjs docs potpie

      - name: Skip docs tree validation
        if: steps.changes.outputs.docs_changed != 'true'
        run: echo "No docs/** changes in this PR; skipping Spoke docs tree validation."

      - name: Enforce documentation updates for user-facing code
        env:
          DOCS_CHANGED: ${{ steps.changes.outputs.docs_changed }}
          USER_FACING: ${{ steps.changes.outputs.user_facing_changed }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'docs-not-required') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$USER_FACING" != "true" ]; then
            echo "No user-facing source changes detected."
            exit 0
          fi
          if [ "$DOCS_CHANGED" = "true" ]; then
            echo "User-facing changes include documentation updates."
            exit 0
          fi
          if [ "$HAS_LABEL" = "true" ]; then
            if ! printf '%s' "$PR_BODY" | grep -qi "Reason documentation is not required"; then
              echo "::error::docs-not-required label is present but the PR body is missing the reason section."
              exit 1
            fi
            if ! printf '%s' "$PR_BODY" | awk 'BEGIN{IGNORECASE=1} /Reason documentation is not required/{f=1;next} f && NF && $0 !~ /<!--/{ok=1} END{exit ok?0:1}'; then
              echo "::error::Provide a written reason under 'Reason documentation is not required' when using docs-not-required."
              exit 1
            fi
            echo "docs-not-required accepted with written reason."
            exit 0
          fi
          echo "::error::User-facing code changed without documentation. Update docs/, or have a maintainer add the docs-not-required label and write a reason in the PR description."
          exit 1
