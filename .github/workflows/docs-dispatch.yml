name: Dispatch hub rebuild

# Hub is notified only when trusted pushes to main touch docs/**.
# Code-only merges do not trigger this workflow, so Hub takes no action.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  dispatch:
    name: Dispatch hub rebuild
    runs-on: ubuntu-latest
    # Only trusted pushes to main; no pull_request_target; no fork code execution.
    steps:
      - name: Send repository_dispatch to Hub
        env:
          DOCS_HUB_DISPATCH_TOKEN: ${{ secrets.DOCS_HUB_DISPATCH_TOKEN }}
          HUB_REPO: ${{ vars.DOCS_HUB_REPO }}
          DEFAULT_HUB_REPO: Nih1tGupta/potpie-docs
          SPOKE_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DOCS_HUB_DISPATCH_TOKEN:-}" ]; then
            echo "::error::DOCS_HUB_DISPATCH_TOKEN secret is not set on this Spoke"
            exit 1
          fi
          if [ -z "${HUB_REPO:-}" ]; then
            HUB_REPO="$DEFAULT_HUB_REPO"
          fi
          payload=$(printf '{"event_type":"spoke-docs-updated","client_payload":{"repository":"%s","branch":"%s","sha":"%s","spoke_id":"potpie"}}' \
            "$SPOKE_REPO" "$BRANCH" "$SHA")
          code=$(curl -sS -o /tmp/dispatch-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DOCS_HUB_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${HUB_REPO}/dispatches" \
            -d "$payload")
          # Never print the token. Response body may be empty on 204.
          echo "Hub dispatch HTTP status: $code"
          if [ "$code" != "204" ]; then
            echo "::error::Hub repository_dispatch failed with HTTP $code"
            # Show response without secrets
            head -c 2000 /tmp/dispatch-response.json || true
            echo
            exit 1
          fi
          echo "Dispatched spoke-docs-updated to $HUB_REPO for $SPOKE_REPO@$SHA"
