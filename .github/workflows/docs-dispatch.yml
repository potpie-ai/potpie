name: Dispatch hub rebuild

# If this workflow is enabled, the job checks trusted pushes to main against
# config/docs.json and notifies Hub only when the configured docs tree changed.
# Docs check is fast PR feedback. Hub fetch-spokes.mjs is the publish gate.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch hub rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Spoke
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: List changed files
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --root --no-commit-id --name-only -r "$AFTER_SHA" > /tmp/changed-files.txt
          else
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" > /tmp/changed-files.txt
          fi
          echo "Changed files:"
          cat /tmp/changed-files.txt

      - name: Check configured docs changes
        id: docs_change
        env:
          DOCS_CONFIG_PATH: ${{ github.workspace }}/config/docs.json
          CHANGED_FILES_PATH: /tmp/changed-files.txt
        run: |
          set -euo pipefail
          should_dispatch="$(node scripts/spoke-contract/docs-dispatch-check.mjs)"
          echo "should_dispatch=$should_dispatch" >> "$GITHUB_OUTPUT"
          echo "Dispatch Hub rebuild: $should_dispatch"

      - name: Send repository_dispatch to Hub
        if: steps.docs_change.outputs.should_dispatch == 'true'
        env:
          DOCS_HUB_DISPATCH_TOKEN: ${{ secrets.DOCS_HUB_DISPATCH_TOKEN }}
          HUB_REPO: ${{ vars.DOCS_HUB_REPO }}
          DEFAULT_HUB_REPO: potpie-ai/docs
          SPOKE_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${DOCS_HUB_DISPATCH_TOKEN:-}" ]; then
            echo "::error::DOCS_HUB_DISPATCH_TOKEN secret is not set on this Spoke"
            exit 1
          fi
          if [ -z "${HUB_REPO:-}" ]; then
            HUB_REPO="$DEFAULT_HUB_REPO"
          fi
          SPOKE_ID="$(node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("config/docs.json","utf8")); if (!c.spokeId) process.exit(1); process.stdout.write(String(c.spokeId))')"
          payload=$(printf '{"event_type":"spoke-docs-updated","client_payload":{"repository":"%s","branch":"%s","sha":"%s","spoke_id":"%s"}}' \
            "$SPOKE_REPO" "$BRANCH" "$SHA" "$SPOKE_ID")
          code=$(curl -sS -o /tmp/dispatch-response.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DOCS_HUB_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${HUB_REPO}/dispatches" \
            -d "$payload")
          echo "Hub dispatch HTTP status: $code"
          if [ "$code" != "204" ]; then
            echo "::error::Hub repository_dispatch failed with HTTP $code"
            head -c 2000 /tmp/dispatch-response.json || true
            echo
            exit 1
          fi
          echo "Dispatched spoke-docs-updated to $HUB_REPO for $SPOKE_REPO@$SHA (spoke_id=$SPOKE_ID)"
