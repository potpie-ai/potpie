name: Regression tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Large transitive wheels (e.g. nvidia-*/torch via context-engine[all]) can
# exceed uv's default HTTP timeout on GitHub-hosted runners.
env:
  UV_HTTP_TIMEOUT: "300"

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.5.1

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  potpie-parsing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --no-cache

      - name: Run parsing_rs Rust tests
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo test --manifest-path potpie/parsing/Cargo.toml --no-default-features

      - name: Check for Python package tests
        working-directory: potpie/parsing
        run: test ! -d tests || uv run --project . pytest tests

  potpie-context-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --no-cache

      - name: Build root and Context Engine distributions
        run: |
          uv build --out-dir dist/root
          uv build --project potpie/context-engine --out-dir dist/context-engine

      - name: Verify isolated Context Engine installation
        run: |
          uv venv .context-engine-package
          uv pip install --python .context-engine-package/bin/python dist/context-engine/*.whl
          .context-engine-package/bin/python scripts/verify_context_package_isolation.py

      - name: Verify isolated root installation
        run: |
          uv venv .root-package
          uv pip install --python .root-package/bin/python dist/context-engine/*.whl dist/root/*.whl
          .root-package/bin/python scripts/verify_context_package_isolation.py --expect-root

  potpie-root:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --no-cache

      - name: Run root Potpie tests
        env:
          POSTGRES_SERVER: "postgresql://postgres:postgres@localhost:5432/postgres"
          ENV: "development"
        run: uv run pytest tests -m "not premerge_journey"

  potpie-context-engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --no-cache

      # Graph journal conformance runs against a private FalkorDB, and the
      # crash test kills and restarts a disposable AOF-enabled one by name.
      - name: Start graph journal FalkorDB fixtures
        run: |
          docker run -d --name journal-falkordb-ci -p 127.0.0.1:6382:6379 -e BROWSER=0 falkordb/falkordb:v4.16.0
          docker run -d --name pie-journal-crash-ci -p 127.0.0.1:6381:6379 -e BROWSER=0 -e 'REDIS_ARGS=--appendonly yes --appendfsync always' falkordb/falkordb:v4.16.0
          for container in journal-falkordb-ci pie-journal-crash-ci; do
            ready=0
            for attempt in $(seq 1 30); do
              if docker exec "$container" redis-cli ping | grep -q PONG; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then docker logs "$container"; exit 1; fi
          done

      - name: Run context-engine package tests
        working-directory: potpie/context-engine
        env:
          POSTGRES_SERVER: "postgresql://postgres:postgres@localhost:5432/postgres"
          ENV: "development"
          POTPIE_JOURNAL_FALKOR_PORT: "6382"
          POTPIE_JOURNAL_CRASH_CONTAINER: pie-journal-crash-ci
          POTPIE_JOURNAL_CRASH_PORT: "6381"
        run: uv run --project . pytest tests -m "not premerge_journey"

  potpie-windows-unit:
    # Windows-specific daemon lifecycle, liveness, git probe and install-status
    # behavior. A focused subset: the full suite assumes POSIX in many places.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --no-cache

      - name: Run Windows-relevant unit tests
        run: >-
          uv run pytest -p no:cacheprovider
          tests/unit/test_daemon_liveness.py
          tests/unit/test_daemon_spawn.py
          tests/unit/test_daemon_recorded_pid.py
          tests/unit/test_daemon_logs.py
          tests/unit/test_cli_daemon_status_logs.py
          tests/unit/test_git_probe.py
          tests/unit/test_cli_install_status_path.py
          tests/unit/test_local_extra_windows_markers.py
          tests/unit/test_local_extra_next_action.py

  premerge-cli-journey:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Journey subprocess budgets sum to ~670s, plus checkout/toolchain/uv sync
    # and workflow UV_HTTP_TIMEOUT=300 on large wheel fetches.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install dependencies
        run: uv sync --frozen --all-packages --no-cache

      - name: Run pre-merge CLI journey test
        env:
          PREMERGE_JOURNEY_REQUIRED: "1"
        run: uv run pytest tests/integration/test_premerge_cli_journey.py -v

  potpie-sandbox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --no-cache

      - name: Run sandbox unit tests
        working-directory: potpie/sandbox
        run: uv run --project . --extra daytona pytest tests/unit

      - name: Run sandbox local integration tests
        working-directory: potpie/sandbox
        run: uv run --project . --extra daytona pytest tests/integration/test_docker_runtime.py tests/e2e/test_local_subprocess_e2e.py

  graph-commits-ui:
    # The explorer's commit diffs, presentation and mutation context are pure
    # TypeScript; run every frontend test, then type-check and build.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test and build the graph explorer
        working-directory: potpie/daemon/http/ui/frontend
        run: |
          npm ci
          npm test
          npm run build
