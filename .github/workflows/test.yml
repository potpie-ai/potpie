name: Regression tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Large transitive wheels (e.g. nvidia-*/torch via context-engine[all]) can
# exceed uv's default HTTP timeout on GitHub-hosted runners.
env:
  UV_HTTP_TIMEOUT: "300"

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.5.1

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  potpie-parsing:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --no-cache

      - name: Run parsing_rs Rust tests
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo test --manifest-path potpie/parsing/Cargo.toml --no-default-features

      - name: Check for Python package tests
        working-directory: potpie/parsing
        run: test ! -d tests || uv run --project . pytest tests

  potpie-context-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --no-cache

      - name: Build root and Context Engine distributions
        run: |
          uv build --out-dir dist/root
          uv build --project potpie/context-engine --out-dir dist/context-engine

      - name: Verify isolated Context Engine installation
        run: |
          uv venv .context-engine-package
          uv pip install --python .context-engine-package/bin/python dist/context-engine/*.whl
          .context-engine-package/bin/python scripts/verify_context_package_isolation.py

      - name: Verify isolated root installation
        run: |
          uv venv .root-package
          uv pip install --python .root-package/bin/python dist/context-engine/*.whl dist/root/*.whl
          .root-package/bin/python scripts/verify_context_package_isolation.py --expect-root

  potpie-root:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        # --all-extras: the root's base install leaves out embeddings, ingestion,
        # telemetry and UI extras that these suites exercise.
        run: uv sync --frozen --all-packages --all-extras --no-cache

      - name: Run root Potpie tests
        env:
          POSTGRES_SERVER: "postgresql://postgres:postgres@localhost:5432/postgres"
          ENV: "development"
        run: uv run pytest tests -m "not premerge_journey"

  potpie-context-engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        # --all-extras: the root's base install leaves out embeddings, ingestion,
        # telemetry and UI extras that these suites exercise.
        run: uv sync --frozen --all-packages --all-extras --no-cache

      - name: Run context-engine package tests
        working-directory: potpie/context-engine
        env:
          POSTGRES_SERVER: "postgresql://postgres:postgres@localhost:5432/postgres"
          ENV: "development"
        run: uv run --project . pytest tests -m "not premerge_journey"

  potpie-windows-unit:
    # Windows-specific daemon lifecycle, liveness, git probe and install-status
    # behavior. A focused subset: the full suite assumes POSIX in many places.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        # The extras the VS Code extension installs on Windows.
        run: uv sync --frozen --no-cache --extra daemon --extra auth --extra telemetry

      - name: Run Windows-relevant unit tests
        run: >-
          uv run pytest -p no:cacheprovider
          tests/unit/test_daemon_liveness.py
          tests/unit/test_daemon_spawn.py
          tests/unit/test_daemon_recorded_pid.py
          tests/unit/test_daemon_logs.py
          tests/unit/test_cli_daemon_status_logs.py
          tests/unit/test_git_probe.py
          tests/unit/test_cli_install_status_path.py
          tests/unit/test_local_extra_windows_markers.py
          tests/unit/test_local_extra_next_action.py

  premerge-cli-journey:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Journey subprocess budgets sum to ~670s, plus checkout/toolchain/uv sync
    # and workflow UV_HTTP_TIMEOUT=300 on large wheel fetches.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable

      - name: Install dependencies
        # --all-extras: the root's base install leaves out embeddings, ingestion,
        # telemetry and UI extras that these suites exercise.
        run: uv sync --frozen --all-packages --all-extras --no-cache

      - name: Run pre-merge CLI journey test
        env:
          PREMERGE_JOURNEY_REQUIRED: "1"
        run: uv run pytest tests/integration/test_premerge_cli_journey.py -v

  thin-install:
    # The base install leaves out embeddings (and torch), ingestion clients,
    # telemetry and the CLI logo. Every other job installs all extras, so a
    # top-level import of an extra's package, or a build-target edit that ships
    # tests or UI sources, only shows up here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build the graph-explorer UI
        # The wheel checks below need the built dist/ and the node_modules
        # tree that a real release build leaves next to it.
        run: make ui-build-ci

      - name: Build the distributions
        run: |
          uv build --project potpie/context-engine --wheel --out-dir dist/context-engine
          uv build --wheel --sdist --out-dir dist/root .

      - name: Check what the distributions ship
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          root = next(pathlib.Path("dist/root").glob("potpie-*.whl"))
          engine = next(pathlib.Path("dist/context-engine").glob("*.whl"))
          for wheel in (root, engine):
              names = zipfile.ZipFile(wheel).namelist()
              shipped = [n for n in names if "/tests/" in n or "node_modules" in n]
              assert not shipped, f"{wheel.name} ships {shipped[:5]}"
              size = wheel.stat().st_size / 1e6
              print(f"{wheel.name}: {len(names)} entries, {size:.2f} MB")

          names = zipfile.ZipFile(root).namelist()
          ui = "potpie/daemon/http/ui/frontend/"
          assert f"{ui}dist/index.html" in names, "built UI missing from the wheel"
          inputs = [n for n in names if n.startswith(ui) and not n.startswith(f"{ui}dist/")]
          assert not inputs, f"UI build inputs in the wheel: {inputs[:5]}"
          assert not any(n.startswith("potpie/context-engine/") for n in names)

          sdist = next(pathlib.Path("dist/root").glob("potpie-*.tar.gz"))
          members = tarfile.open(sdist).getnames()
          assert not any("node_modules" in n for n in members), "node_modules in sdist"
          PY

      - name: Install the base distribution with no extras
        run: |
          uv venv --python 3.12 .venv-thin
          uv pip install --python .venv-thin/bin/python --only-binary :all: \
            dist/context-engine/*.whl dist/root/*.whl

      - name: Check the base install has the local product and no ML stack
        run: |
          .venv-thin/bin/python - <<'PY'
          import importlib.util as util

          for absent in ("torch", "sentence_transformers", "transformers"):
              assert util.find_spec(absent) is None, f"{absent} reached a base install"
          for present in (
              "potpie",
              "potpie_context_engine",
              "aiohttp",
              "fastapi",
              "uvicorn",
              "falkordb",
              "redislite",
          ):
              assert util.find_spec(present) is not None, f"{present} is missing"
          PY

      - name: Run the CLI on a base install
        env:
          CONTEXT_ENGINE_HOME: ${{ runner.temp }}/thin-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/thin-config
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv-thin/bin:$PATH"
          potpie --version

          repo="$RUNNER_TEMP/thin-repo"
          git init -q "$repo"
          git -C "$repo" -c user.email=ci@potpie.ai -c user.name="Potpie CI" \
            -c commit.gpgsign=false commit -q --allow-empty -m "Initial commit"
          cd "$repo"

          # The release workflow's smoke.
          CONTEXT_ENGINE_HOST_MODE=in_process \
            potpie setup --repo . --pot thin --agent claude --dry-run --yes

          # A real local pot on FalkorDB Lite with the bundled hashing embedder,
          # then a record and a search through the daemon.
          CONTEXT_ENGINE_HOST_MODE=in_process \
            potpie --json setup --repo . --pot thin --agent claude --yes
          potpie --json daemon start
          potpie --json record --type fix \
            --summary "QMX exchange uploads retry three times with exponential backoff" \
            --scope service:qmx-exchange
          potpie --json search "upload retry backoff" --include prior_bugs \
            | python -c 'import json, sys; assert json.load(sys.stdin)["items"], "recorded fix not found"'
          # The daemon is left running; the runner reaps it with the job.

  potpie-sandbox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.10.7"

      - name: Install dependencies
        run: uv sync --frozen --all-packages --no-cache

      - name: Run sandbox unit tests
        working-directory: potpie/sandbox
        run: uv run --project . --extra daytona pytest tests/unit

      - name: Run sandbox local integration tests
        working-directory: potpie/sandbox
        run: uv run --project . --extra daytona pytest tests/integration/test_docker_runtime.py tests/e2e/test_local_subprocess_e2e.py
