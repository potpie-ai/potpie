[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "potpie"
version = "2.0.0"
description = "Potpie product distribution"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Potpie AI", email = "engineering@potpie.ai" }]
maintainers = [{ name = "Potpie AI", email = "engineering@potpie.ai" }]
keywords = ["ai", "agents", "code-intelligence", "knowledge-graph", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
# Base = a remote-only client: the CLI, the RPC transport, and the engine's
# contract layer. Everything that exists to run a graph-native store on *this*
# machine -- the FalkorDB driver, the daemon's HTTP server, the local embedder,
# the ingestion clients -- lives behind an extra below. `potpie[all]` restores
# the full local product.
dependencies = [
    "click>=8.1.8",
    "httpx>=0.28.0",
    "potpie-context-core==0.1.0",
    "potpie-context-engine==0.1.0",
    "pydantic-settings>=2.14.2",
    "rich>=13.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
# Version floors here are not decoration. `aiohttp`, `pyjwt` and
# `pydantic-ai-slim` are declared purely as CVE floors for transitive
# dependencies (see the [tool.uv] override-dependencies comments and #1015);
# nothing in potpie/cli or potpie/daemon imports them. Moving a package into an
# extra without its floor is a silent security regression, so the floors move
# with the packages they constrain.
daemon = [
    "potpie-context-engine[http]",
    "fastapi>=0.115.0",
    # Imported directly by potpie/daemon (http/ui/static.py, http/ui/auth.py,
    # main.py) *and* the CVE floor for FastAPI's core (#1015).
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32.0",
    "pyjwt>=2.13.0",
    # process/launcher.py reads the daemon's argv through psutil. It used to
    # arrive by accident as a redislite dependency; once `local` is optional the
    # daemon has to ask for it. Absent, launcher falls back to `ps`.
    "psutil>=7.0",
]
# A graph-native local store is served by a host process; `in_process` is a
# fallback, not a second supported topology. Hence local implies daemon.
local = [
    "potpie[daemon]",
    "potpie-context-engine[local]",
]
auth = ["potpie-context-engine[cli-auth]"]
embeddings = ["potpie-context-engine[embeddings]"]
ingest = [
    "potpie-context-engine[github,reconciliation-agent]",
    "aiohttp>=3.14.3",            # CVE floor
    "pydantic-ai-slim>=1.102.0",  # CVE floor
]
telemetry = [
    "sentry-sdk>=2.61.1,<3.0.0",
    "potpie-context-engine[observability]",
]
# Pillow drives the CLI's animated logo (potpie/cli/ui/logo_rotation.py, already
# probed with pillow_available()). The daemon never touches it, so filing it
# under `daemon` would make a CLI-only user install a server to get a logo.
ui = ["pillow>=12.3.0"]
all = ["potpie[daemon,local,auth,embeddings,ingest,telemetry,ui]"]

[project.scripts]
potpie = "potpie.cli.main:main"
potpie-daemon = "potpie.daemon.main:main"

[project.urls]
Homepage = "https://potpie.ai"
Documentation = "https://docs.potpie.ai"
Source = "https://github.com/potpie-ai/potpie"
Issues = "https://github.com/potpie-ai/potpie/issues"

[tool.hatch.build.targets.wheel]
packages = ["potpie"]
include = [
    "potpie/cli/templates/**/*",
    "potpie/cli/ui/assets/**/*",
    "potpie/daemon/http/ui/frontend/dist/**/*",
]
exclude = [
    "/potpie/context-core",
    "/potpie/context-engine",
    "/potpie/integrations",
    "/potpie/parsing",
    "/potpie/sandbox",
    # The graph UI's build inputs, not its build output. `dist/**` above is what
    # ships. Both are gitignored, but only by the frontend's own nested
    # .gitignore, and hatchling reads the root one only -- so on any machine
    # that has run `make ui-build` this tree lands in the wheel (~27 MB, 96% of
    # its entries) unless it is excluded by name. Named explicitly rather than
    # `**/node_modules` so that vendoring one on purpose stays a decision.
    "/potpie/daemon/http/ui/frontend/node_modules",
]

[tool.hatch.build.force-include]
"potpie/cli/templates/claude_plugin/.claude-plugin/marketplace.json" = "potpie/cli/templates/claude_plugin/.claude-plugin/marketplace.json"
"potpie/cli/templates/claude_plugin/.claude-plugin/plugin.json" = "potpie/cli/templates/claude_plugin/.claude-plugin/plugin.json"
"potpie/cli/templates/claude_plugin/hooks/hooks.json" = "potpie/cli/templates/claude_plugin/hooks/hooks.json"

# Stamps `potpie/_build.json` (git rev, dirty flag, build time) into every
# build. The version above is a constant while the code moves with every
# commit, and consumers pin by rev; without this nothing installed can say
# which rev it is. See hatch_build.py and potpie/build_info.py.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/hatch_build.py",
    "/scripts/generate-potpie-ascii.mjs",
    "/potpie/__init__.py",
    "/potpie/cli",
    "/potpie/daemon",
]
exclude = [
    "/.gitignore",
    "/potpie/context-core",
    "/potpie/context-engine",
    "/potpie/integrations",
    "/potpie/parsing",
    "/potpie/sandbox",
    # Same tree, same reason as the wheel target: `/potpie/daemon` is included
    # wholesale above, which sweeps the frontend's build inputs in with it.
    "/potpie/daemon/http/ui/frontend/node_modules",
]

[tool.uv]
# litellm>=1.83.10 clears CVE-2026-40217 (<1.83.10) but pins openai==2.24.0, which conflicts with
# pydantic-ai + context-engine; override to the root stack.
override-dependencies = [
    "python-dotenv>=1.2.2",
    "openai>=2.7.1",
    "idna>=3.15",
    "cryptography>=48.0.1",
    # CVE-2026-59881 / CVE-2026-69243 / CVE-2026-69244: floor at 3.14.3.
    "aiohttp>=3.14.3",
    "starlette>=1.3.1",
    "pyjwt>=2.13.0",
    "pydantic-settings>=2.14.2",
    "pydantic-ai-slim>=1.102.0",
    # CVE-2025-3000: torch <= 2.12.1; 2.13.0 is the first patched release on PyPI.
    "torch>=2.13.0",
]

[tool.uv.workspace]
members = [
    "potpie/context-core",
    "potpie/context-engine",
    "potpie/integrations",
    "potpie/parsing",
    "potpie/sandbox",
]

[tool.uv.sources]
potpie-context-core = { workspace = true, editable = true }
potpie-context-engine = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=7.0.0",
    "pre-commit>=4.3.0",
    "pylint>=4.0.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests (no external services required, but exercise real third-party libs)",
    "cli_auth_e2e: opt-in live CLI auth tests (Linear/Jira/Confluence); requires RUN_CLI_AUTH_E2E=1",
    "premerge_journey: dedicated pre-merge CLI journey test (Rust required; run in premerge-cli-journey job only)",
]

[tool.ruff.lint]
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"potpie/cli/commands/_common.py" = ["S112"]
"potpie/cli/ui/setup_ux.py" = ["S112"]
"tests/_auth_fakes.py" = ["S108"]
"tests/unit/test_cli_linear.py" = ["S310"]
"tests/unit/test_nudge_adapter.py" = ["S102"]
