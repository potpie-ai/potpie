[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "sentry_defaults_hook.py"

[project]
name = "potpie-context-engine"
version = "0.2.0"
description = "Context graph API and webhooks."
requires-python = ">=3.12,<3.15"
classifiers = ["Typing :: Typed"]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32.0",
]
local = [
    "falkordb>=1.6.1",
    "ladybug>=0.20.4,<0.21; sys_platform == 'win32'",
    "potpie-falkordblite==0.10.0.post1; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64' or platform_machine == 'ARM64')",
    "falkordblite>=0.10.0; python_version >= '3.12' and sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'ARM64'))",
    "redis>=7.1,<8; python_version >= '3.12' and sys_platform != 'win32'",
    "hiredis>=3.0.0; python_version >= '3.12' and sys_platform != 'win32'",
]
ladybug = [
    "ladybug>=0.20.4,<0.21",
]
neo4j = [
    "neo4j>=5.28.0",
]
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]
benchmarks = [
    "pyyaml>=6.0",
    "openai>=1.50.0",
]
embeddings = [
    "sentence-transformers>=5.6.0",
]
github = [
    "pygithub>=2.8.0",
]
reconciliation-agent = [
    "pydantic-deep>=0.3.0",
    "pydantic-ai-slim>=2.53.0",
]
hatchet = [
    "hatchet-sdk>=1.29.0",
    "aiohttp>=3.14.3",
]
observability = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0; sys_platform == 'win32' and (platform_machine == 'ARM64' or platform_machine == 'arm64' or platform_machine == 'aarch64')",
    "opentelemetry-exporter-otlp>=1.27.0; sys_platform != 'win32' or (platform_machine != 'ARM64' and platform_machine != 'arm64' and platform_machine != 'aarch64')",
    "opentelemetry-instrumentation-openai>=0.40b0",
    "sentry-sdk>=2.61.1,<3.0.0",
]
all = [
    "potpie-context-engine[http,local,neo4j,postgres,hatchet,observability,embeddings,github,reconciliation-agent]",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/potpie_context_engine"]
include = [
    "src/potpie_context_engine/py.typed",
    "src/potpie_context_engine/core/playbooks/**/*.md",
    "src/potpie_context_engine/benchmarks/use_cases/**/*.yaml",
    "src/potpie_context_engine/benchmarks/fixtures/raw_events/**/*.json",
    "src/potpie_context_engine/benchmarks/_legacy/data/**/*.json",
]
exclude = ["**/tests/**"]

[tool.hatch.build.targets.sdist]
include = [
    "sentry_defaults_hook.py",
    "src/potpie_context_engine",
    "scripts/**/*.py",
    "scripts/**/*.json",
    "scripts/**/*.mjs",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests (no external services required, but exercise real third-party libs)",
    "premerge_journey: dedicated pre-merge CLI journey test (Rust required; run in premerge-cli-journey job only)",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[tool.uv]
override-dependencies = [
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
]
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.0",
    "gitpython>=3.1.58",
    "idna>=3.15",
    "pyjwt>=2.15.0",
    "pydantic-ai-slim>=2.53.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.28",
    "starlette>=1.3.1",
    "torch>=2.13.0",
    "urllib3>=2.8.0",
    "httpx2>=2.12.0",
    "httpcore2>=2.10.0",
    "anyio>=4.14.2",
    "soupsieve>=2.9.0",
    "multidict>=6.9.1",
    "fsspec>=2026.6.0",
]

[tool.uv.sources]
potpie-falkordblite = { path = "../falkordblite" }
