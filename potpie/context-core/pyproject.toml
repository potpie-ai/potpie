[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "potpie-context-core"
version = "0.1.0"
description = "Temporary compatibility re-exports for the Potpie Context Engine core."
requires-python = ">=3.12,<3.15"
classifiers = ["Typing :: Typed"]
# This same-PR migration shim contains no implementation. It retires after all
# root callers import the Context Engine distribution directly.
dependencies = [
    "potpie-context-engine==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/potpie_context_core"]
include = [
    "src/potpie_context_core/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/potpie_context_core",
]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
]
